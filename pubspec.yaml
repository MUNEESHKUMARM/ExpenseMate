name: my_first_app
description: "Personal Expense Tracker - Track daily income and expenses"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  flutter_native_splash: ^2.4.5
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  # Google Sign-In
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icon/app_icon.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#000000"
    image: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
